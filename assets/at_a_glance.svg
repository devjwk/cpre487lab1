<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 384" role="img" aria-label="Lab 1 at a glance: accuracy, where the time goes, batching, retraining">
<title>Lab 1 at a glance: accuracy, where the time goes, batching, retraining</title>
<style>.q{font:700 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:1.5px}.big{font:800 44px ui-sans-serif,system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}.sub{font:500 14px ui-sans-serif,system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#475569}.lab{font:500 13px ui-sans-serif,system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#0B1220}.val{font:700 13px ui-sans-serif,system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#0B1220}.valbig{font:700 16px ui-sans-serif,system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#0B1220}.note{font:500 12px ui-sans-serif,system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#475569}.tiny{font:600 11px ui-sans-serif,system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#475569}</style>
<rect width="1200" height="384" fill="#ffffff"/>
<g transform="translate(0,0)">
<rect width="285" height="384" fill="#F8FAFC"/>
<rect width="285" height="6" fill="#0F766E"/>
<text x="18" y="38" class="q" fill="#0F766E">HOW ACCURATE IS IT?</text>
<text x="18" y="92" class="big" fill="#0B1220">24.3%</text>
<text x="18" y="118" class="sub">Top-1 on 10,000 validation images.</text>
<text x="18" y="136" class="sub">Chance would be 0.5%.</text>
<g transform="translate(18,170)"><text x="0" y="19" class="lab">Top-1</text>
<rect x="64" y="4" width="133" height="22" fill="#E2E8F0"/>
<rect x="64" y="4" width="32.3" height="22" fill="#0F766E"/>
<text x="205" y="20" class="val">24.3%</text>
<text x="0" y="57" class="lab">Top-5</text>
<rect x="64" y="42" width="133" height="22" fill="#E2E8F0"/>
<rect x="64" y="42" width="65.7" height="22" fill="#0F766E"/>
<text x="205" y="58" class="val">49.4%</text>
<text x="0" y="95" class="lab">Top-10</text>
<rect x="64" y="80" width="133" height="22" fill="#E2E8F0"/>
<rect x="64" y="80" width="82.1" height="22" fill="#0F766E"/>
<text x="205" y="96" class="val">61.7%</text></g></g>
<g transform="translate(305,0)">
<rect width="285" height="384" fill="#F8FAFC"/>
<rect width="285" height="6" fill="#0F766E"/>
<text x="18" y="38" class="q" fill="#0F766E">WHERE DOES THE TIME GO?</text>
<text x="18" y="92" class="big" fill="#0B1220">conv2d_1</text>
<text x="18" y="118" class="sub">One layer takes 53% of the</text>
<text x="18" y="136" class="sub">compute at batch size 200.</text>
<g transform="translate(18,170)"><rect x="0.0" y="0" width="132.0" height="34" fill="#0F766E"/>
<rect x="132.0" y="0" width="102.1" height="34" fill="#5EEAD4"/>
<rect x="234.1" y="0" width="14.9" height="34" fill="#CBD5E1"/>
<rect x="0" y="50" width="14" height="14" fill="#0F766E"/>
<text x="22" y="62" class="lab">conv2d_1</text>
<text x="249" y="62" class="val" text-anchor="end">53%</text>
<rect x="0" y="78" width="14" height="14" fill="#5EEAD4"/>
<text x="22" y="90" class="lab">the other 5 convolutions</text>
<text x="249" y="90" class="val" text-anchor="end">41%</text>
<rect x="0" y="106" width="14" height="14" fill="#CBD5E1"/>
<text x="22" y="118" class="lab">pooling and dense</text>
<text x="249" y="118" class="val" text-anchor="end">6%</text></g></g>
<g transform="translate(610,0)">
<rect width="285" height="384" fill="#F8FAFC"/>
<rect width="285" height="6" fill="#0F766E"/>
<text x="18" y="38" class="q" fill="#0F766E">DOES BATCHING HELP?</text>
<text x="18" y="92" class="big" fill="#0B1220">47×</text>
<text x="18" y="118" class="sub">Throughput at batch 200 compared</text>
<text x="18" y="136" class="sub">with one image at a time.</text>
<g transform="translate(18,170)"><rect x="9.5" y="147.0" width="30.9" height="3.0" fill="#0F766E"/>
<text x="24.9" y="141.0" class="val" text-anchor="middle">18</text>
<text x="24.9" y="168" class="lab" text-anchor="middle">1</text>
<rect x="59.3" y="112.7" width="30.9" height="37.3" fill="#0F766E"/>
<text x="74.7" y="106.7" class="val" text-anchor="middle">224</text>
<text x="74.7" y="168" class="lab" text-anchor="middle">20</text>
<rect x="109.1" y="88.8" width="30.9" height="61.2" fill="#0F766E"/>
<text x="124.5" y="82.8" class="val" text-anchor="middle">367</text>
<text x="124.5" y="168" class="lab" text-anchor="middle">40</text>
<rect x="158.9" y="50.8" width="30.9" height="99.2" fill="#0F766E"/>
<text x="174.3" y="44.8" class="val" text-anchor="middle">595</text>
<text x="174.3" y="168" class="lab" text-anchor="middle">100</text>
<rect x="208.7" y="9.7" width="30.9" height="140.3" fill="#5EEAD4"/>
<text x="224.1" y="3.7" class="val" text-anchor="middle">842</text>
<text x="224.1" y="168" class="lab" text-anchor="middle">200</text>
<line x1="0" y1="150" x2="249" y2="150" stroke="#475569"/>
<text x="0" y="190" class="note">images per second, by batch size</text></g></g>
<g transform="translate(915,0)">
<rect width="285" height="384" fill="#F8FAFC"/>
<rect width="285" height="6" fill="#0F766E"/>
<text x="18" y="38" class="q" fill="#0F766E">CAN WE RETRAIN IT?</text>
<text x="18" y="92" class="big" fill="#0B1220">24–25%</text>
<text x="18" y="118" class="sub">Trained from scratch: the same</text>
<text x="18" y="136" class="sub">accuracy as the provided model.</text>
<g transform="translate(18,170)"><text x="0" y="19" class="lab">3 epochs</text>
<rect x="74" y="4" width="123" height="22" fill="#E2E8F0"/>
<rect x="74" y="4" width="77.5" height="22" fill="#0F766E"/>
<text x="205" y="20" class="val">18.9%</text>
<text x="0" y="57" class="lab">8 epochs</text>
<rect x="74" y="42" width="123" height="22" fill="#E2E8F0"/>
<rect x="74" y="42" width="100.0" height="22" fill="#5EEAD4"/>
<text x="205" y="58" class="val">24.4%</text>
<text x="0" y="95" class="lab">provided</text>
<rect x="74" y="80" width="123" height="22" fill="#E2E8F0"/>
<rect x="74" y="80" width="99.6" height="22" fill="#0F766E"/>
<text x="205" y="96" class="val">24.3%</text><text x="0" y="136" class="note">Top-1. More epochs did not help.</text></g></g>
</svg>
